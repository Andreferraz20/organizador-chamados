appId: com.organizadorchamados.app
productName: Área do Técnico
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
extraResources:
  - from: resources/documentacao
    to: documentacao
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
